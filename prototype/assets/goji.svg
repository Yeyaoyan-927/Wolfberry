<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <radialGradient id="main" cx="34%" cy="24%" r="80%">
      <stop offset="0%" stop-color="#EE7F62"/>
      <stop offset="34%" stop-color="#CE3E30"/>
      <stop offset="70%" stop-color="#AE2A22"/>
      <stop offset="100%" stop-color="#7F1A14"/>
    </radialGradient>
    <radialGradient id="side" cx="32%" cy="22%" r="82%">
      <stop offset="0%" stop-color="#E27357"/>
      <stop offset="40%" stop-color="#C1362B"/>
      <stop offset="100%" stop-color="#8A1D17"/>
    </radialGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#8A1C16" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <ellipse cx="170" cy="126" rx="43" ry="33" transform="rotate(-8 170 126)" fill="url(#side)"/>
    <ellipse cx="70" cy="132" rx="40" ry="31" transform="rotate(9 70 132)" fill="url(#side)"/>
    <ellipse cx="120" cy="106" rx="56" ry="42" transform="rotate(-6 120 106)" fill="url(#main)"/>
  </g>

  <!-- 主果高光 -->
  <ellipse cx="98" cy="88" rx="18" ry="8" transform="rotate(-16 98 88)" fill="#FFFFFF" opacity="0.14"/>
  <!-- 主果果梗与宿萼 -->
  <path d="M120 65 q3 -14 -7 -19" fill="none" stroke="#6B5130" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M112 48 q12 -6 17 2" fill="none" stroke="#6E7B40" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="120" cy="65" rx="7" ry="3" fill="#7A5C33" opacity="0.55"/>
  <!-- 侧果果梗 -->
  <path d="M170 94 q4 -11 -4 -15" fill="none" stroke="#6B5130" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M70 102 q3 -10 -4 -13" fill="none" stroke="#6B5130" stroke-width="2.4" stroke-linecap="round"/>
</svg>
